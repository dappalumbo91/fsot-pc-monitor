name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: cargo build + test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The monitor is a Windows-first desktop app (eframe/egui); on Linux CI
      # this is a compile check. There are no unit tests yet, so cargo test
      # only confirms the test harness builds.
      - name: cargo build
        run: cargo build --locked

      - name: cargo test
        run: cargo test --locked
